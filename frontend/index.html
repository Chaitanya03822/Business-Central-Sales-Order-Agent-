<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Central Agent</title>

   <link rel="stylesheet" href="/frontend/style.css">
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="chat-header">

            <div class="brand">

                <div class="brand-icon">
                    BC
                </div>

                <div>
                    <h1>Business Central Agent</h1>

                    <p>
                        AI-powered Business Central Assistant
                    </p>
                </div>

            </div>

            <div class="status">

                <span class="status-dot"></span>

                <span>Online</span>

            </div>

        </header>


        <!-- Chat Area -->
        <main class="chat-container">

            <div id="chatMessages" class="chat-messages">

                <!-- Initial AI Message -->

                <div class="message ai-message">

                    <div class="message-avatar">
                        AI
                    </div>

                    <div class="message-content">

                        <div class="message-name">
                            Business Central Agent
                        </div>

                        <div class="message-bubble">
                            Hello! How can I help you with
                            Business Central today?
                        </div>

                    </div>

                </div>

            </div>


            <!-- Typing Indicator -->

            <div
                id="typingIndicator"
                class="typing-indicator hidden">

                <div class="message-avatar">
                    AI
                </div>

                <div class="typing-bubble">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <!-- Input Area -->

            <form
                id="chatForm"
                class="chat-input-area">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask about products, customers, inventory or orders..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    id="sendButton">

                    Send

                </button>

            </form>

        </main>

    </div>


   <script src="/frontend/app.js"></script>

</body>

</html>
